name: GitHub Streak Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Streak Stats
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          token: ${{ secrets.STREAK_TOKEN }}
          user: "${{ github.repository_owner }}"
          timezone: "Asia/Baku"
          theme: "tokyonight"
          hide_border: "true"
          output: "streak-stats.svg"
          path: "streak-stats.svg"
          options: "user=${{ github.repository_owner }}&timezone=Asia/Baku&theme=tokyonight&hide_border=true"

      - name: Commit and push streak stats
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git commit -m "Update streak stats [skip ci]" || exit 0
          git push origin main
